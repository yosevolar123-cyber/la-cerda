<section class="pagina">
  <app-page-header
    titulo="Usuarios"
    subtitulo="Cambia el rol o bloquea el acceso de cualquier cuenta."
  />

  @if (cargando()) {
    <div class="skeleton" style="height: 22rem"></div>
  } @else {
    <div class="tabla-wrap">
      <table class="tabla">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (u of usuarios(); track u.id) {
            <tr>
              <td>{{ u.perfiles?.nombre ?? '—' }}</td>
              <td>{{ u.email }}</td>
              <td>{{ u.perfiles?.telefono ?? '—' }}</td>
              <td>
                <select
                  class="select"
                  [value]="roles().find((r) => r.nombre === u.roles?.nombre)?.id"
                  (change)="cambiarRol(u.id, $any($event.target).value)"
                >
                  @for (r of roles(); track r.id) {
                    <option [value]="r.id">{{ ROLE_LABELS[r.nombre] }}</option>
                  }
                </select>
              </td>
              <td>
                <select
                  class="select"
                  [value]="u.estado"
                  (change)="cambiarEstado(u.id, $any($event.target).value)"
                >
                  <option value="activo">Activo</option>
                  <option value="inactivo">Inactivo</option>
                  <option value="bloqueado">Bloqueado</option>
                </select>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
