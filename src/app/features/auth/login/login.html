<section class="auth-screen">
  <div class="auth-screen__contenido">
    <div class="auth-screen__brand">
      <img src="brand/logo-mark.png" alt="" width="88" height="88" />
      <h1>La Cerda</h1>
      <p>Embutidos y pollo Sofía — pedidos en línea</p>
    </div>

    <form class="auth-screen__card" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <h2>Iniciar sesión</h2>

      @if (vieneDelCheckout(redirect())) {
        <p class="auth-screen__aviso" role="status">
          Inicia sesión o crea tu cuenta para finalizar tu pedido. Tu carrito se conserva.
        </p>
      }

      @if (errorGeneral()) {
        <p class="field__error" role="alert">{{ errorGeneral() }}</p>
      }

      <div class="field">
        <label class="field__label" for="email">Correo</label>
        <input
          id="email"
          class="input"
          type="email"
          formControlName="email"
          placeholder="tucorreo@gmail.com"
          autocomplete="email"
        />
        <app-field-error [control]="email" />
      </div>

      <div class="field">
        <label class="field__label" for="password">Contraseña</label>
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <app-field-error [control]="password" />
      </div>

      <app-button type="submit" size="lg" [loading]="enviando()">Entrar</app-button>

      <p class="auth-screen__switch">
        ¿No tienes cuenta? <a routerLink="/auth/registro" [queryParams]="redirect() ? { redirect: redirect() } : {}"
          >Regístrate</a
        >
      </p>
    </form>
  </div>
</section>
